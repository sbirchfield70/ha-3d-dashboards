<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Cards Demo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
  html, body { margin: 0; background: #0f2547; color: #eef4ff; font-family: Nunito, sans-serif; }
  #wrap { padding: 0; }
  #wrap.cards { padding: 16px; max-width: 1180px; margin: 0 auto; display: grid; gap: 18px; }
  #wrap.grid3 { grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; gap: 12px; --primary-text-color: #f2f6fc; --secondary-text-color: #c3d2e8; }
  .col { display: grid; gap: 12px; min-width: 0; } .row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  #err { color: #ff8a7a; white-space: pre-wrap; font: 14px monospace; padding: 8px; }
</style>
<script src="mock-hass.js"></script>
</head>
<body>
<div id="wrap"></div>
<div id="err"></div>
<script>
  // Demo previews with made-up entities. Open index.html?card=home|bedroom|tv|garage|home80|home80amber|hero|car|tiles|appliances (&panel=... for tv/garage)
  window.addEventListener("error", (e) => (document.getElementById("err").textContent += "ERROR: " + e.message + " @" + e.filename + ":" + e.lineno + "\n"));
  const card = new URLSearchParams(location.search).get("card") || "home";
  const CONFIGS = {
    home: { file: "home3d-card.js", tag: "home3d-card", cfg: {
      weather: "weather.home", indoor: ["climate.downstairs", "climate.upstairs"], calendars: ["calendar.family"],
      rooms: [
        { name: "Kitchen", scene: "kitchen", temp_entity: "climate.downstairs", items: [
          { entity: "light.kitchen_ceiling", name: "Main Lights", icon: "mdi:ceiling-light", role: "main" },
          { entity: "light.kitchen_island", name: "Island", icon: "mdi:ceiling-light-multiple", role: "pendants" },
          { entity: "light.kitchen_strip", name: "Strip", icon: "mdi:led-strip-variant", role: "strip" }] },
        { name: "Dining Room", scene: "dining", items: [
          { entity: "light.dining_chandelier", name: "Chandelier", icon: "mdi:chandelier", role: "chandelier" },
          { entity: "switch.china_cabinet", name: "Cabinet", icon: "mdi:dresser", role: "cabinet" }] },
        { name: "Living Room", scene: "living", temp_entity: "climate.downstairs", items: [
          { entity: "switch.tv_plug", name: "TV", icon: "mdi:television-classic", role: "tv" },
          { entity: "switch.ceiling_fan", name: "Fan", icon: "mdi:ceiling-fan", role: "fan" },
          { entity: "climate.downstairs", name: "Thermostat", role: "thermostat" }] },
        { name: "Bedroom", scene: "bedroom", temp_entity: "sensor.bedroom_temperature", items: [
          { entity: "light.bedside_left", name: "Left Lamp", icon: "mdi:lamp", role: "lamp_left" },
          { entity: "light.bedside_right", name: "Right Lamp", icon: "mdi:lamp", role: "lamp_right" },
          { entity: "light.purifier_night_light", name: "Night Light", icon: "mdi:air-purifier", role: "nightlight" }] },
      ] } },
    bedroom: { file: "bedroom3d-card.js", tag: "bedroom3d-card", cfg: { calendars: ["calendar.family"] } },
    tv: { file: "tv3d-card.js", tag: "tv3d-card", cfg: { calendars: ["calendar.family"] } },
    garage: { file: "garage3d-card.js", tag: "garage3d-card", cfg: {} },
    home80: { file: "home80-card.js", tag: "home80-card", cfg: { indoor: ["climate.downstairs", "climate.upstairs"], calendars: ["calendar.family"] } },
    home80amber: { file: "home80-card.js", tag: "home80-card", cfg: { color: "amber", indoor: ["climate.downstairs", "climate.upstairs"], calendars: ["calendar.family"] } },
    hero: { file: "room3d.js", multi: [
      { tag: "room3d-hero", cfg: { scene: "home", title: "Home", icon: "mdi:home",
        entities: { garage: "cover.garage_door", porch_light: "light.porch", garage_lights: ["light.garage_left", "light.garage_right"], lock: "lock.front_door" },
        stats: [{ entity: "lock.front_door", name: "Front Door", good: ["locked"], bad: ["unlocked", "jammed"] }, { entity: "cover.garage_door", name: "Garage", good: ["closed"] },
                { entity: "sensor.outdoor_humidity", name: "Humidity", icon: "mdi:water-percent" }, { entity: "climate.downstairs", name: "Downstairs" }] } },
      { tag: "room3d-hero", cfg: { scene: "pets", title: "Pets", icon: "mdi:paw",
        entities: { feeding: "binary_sensor.cat_feeder_feeding", food_level: "binary_sensor.cat_feeder_food_level", litter_code: "sensor.litter_robot_status_code" },
        stats: [{ entity: "vacuum.litter_robot", name: "Litter-Robot", icon: "mdi:cat" }, { entity: "sensor.litter_robot_waste_drawer", name: "Waste Drawer", icon: "mdi:delete-variant" }] } },
      { tag: "room3d-hero", cfg: { scene: "system", title: "Servers", icon: "mdi:server-network",
        entities: { nodes: [{ name: "node1", kind: "mini", entity: "binary_sensor.node1_status" }, { name: "node2", kind: "rack", entity: "binary_sensor.node2_status" }, { name: "node3", kind: "mini", entity: "binary_sensor.node3_status" }] },
        stats: [{ entity: "binary_sensor.cluster_quorate", name: "Cluster", icon: "mdi:server-network", good: ["on"], bad: ["off"] }] } },
    ] },
    car: { file: "room3d.js", multi: [
      { tag: "room3d-hero", cfg: { scene: "car", title: "My Car", icon: "mdi:car-estate", entities: { lock: "lock.car_doors", ignition: "switch.car_ignition" },
        stats: [{ entity: "lock.car_doors", name: "Doors", good: ["locked"], bad: ["unlocked"] }, { entity: "sensor.car_fuel", name: "Fuel", icon: "mdi:gas-station" }] } },
      { tag: "room3d-hero", cfg: { scene: "shed", title: "Shed", icon: "mdi:home-variant-outline", entities: { power_probe: ["switch.shed_lights"], lights: "switch.shed_lights", string_lights: "switch.shed_string_lights", ac: "climate.shed_ac" } } },
    ] },
    tiles: { file: "room3d.js", multi: [
      { tag: "room3d-tiles", cfg: { entities: [
        { entity: "light.kitchen_ceiling", name: "Kitchen" }, { entity: "light.dining_chandelier", name: "Dining Room" },
        { entity: "switch.china_cabinet", name: "Cabinet", icon: "mdi:led-strip-variant" }, { entity: "light.bedside_left", name: "Left Lamp" },
        { entity: "cover.garage_door", name: "Garage" }, { entity: "lock.front_door", name: "Front Door" },
        { entity: "switch.backyard_lights", name: "Backyard", icon: "mdi:string-lights" }, { entity: "fan.purifier", name: "Purifier" }] } },
    ] },
    appliances: { file: "home-appliance-cards.js", columns: [
      [ { tag: "home-washer-card", cfg: { name: "Washer / Dryer", entity: "sensor.washer_machine_state", program: "sensor.washer_cycle", remaining: "sensor.washer_time_remaining" } },
        { tag: "home-fridge-card", cfg: { name: "Fridge", temperature: "number.fridge_temperature", freezer_temperature: "number.freezer_temperature", door: "binary_sensor.fridge_door", max_temperature: 40 } },
        { tag: "home-tv-card", cfg: { name: "Living Room TV", entity: "media_player.living_room_tv" } },
        { tag: "home-ac-split-card", cfg: { name: "Shed AC", entity: "climate.shed_ac", temperature: "sensor.shed_temperature" } } ],
      [ { tag: "home-garage-door-card", cfg: { name: "Garage Door", entity: "cover.garage_door", travel_time: 14 } },
        { tag: "home-mower-card", cfg: { name: "Robot Mower", entity: "lawn_mower.robot_mower", entity_battery: "sensor.robot_mower_battery", entity_next_start: "sensor.robot_mower_next_start" } },
        { row: [ { tag: "home-mini-pc-card", cfg: { name: "node1", entity: "binary_sensor.node1_status", entity_cpu: "sensor.node1_cpu_used", entity_ram: "sensor.node1_memory_used", entity_disk: "sensor.node1_disk_used", entity_uptime: "sensor.node1_last_boot", extra_tiles: [{ entity: "sensor.node1_vms", name: "VMs", icon: "mdi:monitor" }, { entity: "sensor.node1_containers", name: "Containers", icon: "mdi:package-variant-closed" }] } },
            { tag: "home-server-rack-card", cfg: { name: "node2", entity: "binary_sensor.node2_status" } },
            { tag: "home-mini-pc-card", cfg: { name: "node3", entity: "binary_sensor.node3_status", entity_cpu: "sensor.node3_cpu_used", entity_ram: "sensor.node3_memory_used", entity_disk: "sensor.node3_disk_used", entity_uptime: "sensor.node3_last_boot" } } ] } ],
      [ { tag: "home-vacuum-card", cfg: { name: "Robot Vacuum", entity: "vacuum.main_vacuum", entity_battery: "sensor.main_vacuum_battery", entity_area: "sensor.main_vacuum_cleaned_area", entity_time: "sensor.main_vacuum_cleaning_time", entity_filter: "sensor.main_vacuum_filter_left", entity_brush: "sensor.main_vacuum_main_brush_left" } },
        { row2: [ { tag: "home-bin-card", cfg: { name: "Garbage", bin: "green", content: "trash", entity: "sensor.next_trash_pickup_date", interval: 7 } },
            { tag: "home-bin-card", cfg: { name: "Recycling", bin: "blue", content: "recyclables", entity: "sensor.next_recycling_pickup_date", interval: 14 } } ] },
        { row2: [ { tag: "home-ceiling-fan-card", cfg: { name: "Ceiling Fan", entity: "switch.living_room_ceiling_fan" } },
            { tag: "home-fan-card", cfg: { name: "Desk Fan", entity: "switch.desk_fan" } } ] } ] ] },
  };
  const C = CONFIGS[card];
  const s = document.createElement("script");
  s.type = "module"; s.src = "../cards/" + C.file;
  s.onload = () => {
    const wrap = document.getElementById("wrap");
    const mk = (x, parent) => { const el = document.createElement(x.tag); el.setConfig(x.cfg); parent.appendChild(el); el.hass = window.mockHass; setTimeout(() => (el.hass = window.mockHass), 400); };
    if (C.columns) {
      wrap.className = "cards grid3";
      for (const colDef of C.columns) {
        const col = document.createElement("div"); col.className = "col"; wrap.appendChild(col);
        for (const x of colDef) {
          const group = x.row || x.row2;
          if (group) { const r = document.createElement("div"); r.className = "row3"; if (x.row2) r.style.gridTemplateColumns = "minmax(0,1fr) minmax(0,1fr)"; col.appendChild(r); group.forEach((g) => mk(g, r)); }
          else mk(x, col);
        }
      }
      return;
    }
    const list = C.multi || [{ tag: C.tag, cfg: C.cfg }];
    if (C.multi) wrap.className = "cards";
    for (const x of list) {
      const el = document.createElement(x.tag);
      el.setConfig(x.cfg);
      wrap.appendChild(el);
      el.hass = window.mockHass;
      setTimeout(() => (el.hass = window.mockHass), 400);
    }
  };
  document.head.appendChild(s);
</script>
</body>
</html>
